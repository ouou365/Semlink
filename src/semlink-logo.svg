<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Semlink">
 <g transform="translate(512 512) scale(1.125) translate(-512 -512)">
  <!-- 外层立方体轮廓（正六边形，去掉三条直径对角线）—— 中景 -->
  <path d="M512 72 L893 292 L893 732 L512 952 L131 732 L131 292 Z"
        fill="none" stroke="currentColor" stroke-width="48" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 6 条连接线：外顶点 → 小立方体顶点（不进入内部）—— 中景 -->
  <g stroke="currentColor" stroke-width="48" stroke-linecap="round">
    <line x1="512" y1="72" x2="512" y2="288"/>
    <line x1="893" y1="292" x2="706" y2="400"/>
    <line x1="893" y1="732" x2="706" y2="624"/>
    <line x1="512" y1="952" x2="512" y2="736"/>
    <line x1="131" y1="732" x2="318" y2="624"/>
    <line x1="131" y1="292" x2="318" y2="400"/>
  </g>

  <!-- 小立方体线框（空心）—— 近景，最粗 -->
  <path d="M512 288 L706 400 L706 624 L512 736 L318 624 L318 400 Z"
        fill="none" stroke="currentColor" stroke-width="58" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 小立方体内部对角线（已删除朝上/左下/右下的中心 3 段，仅保留向"下/右上/左上"三段）—— 近景，最粗 -->
  <path d="M512 512 L512 736 M706 400 L512 512 M318 400 L512 512"
        fill="none" stroke="currentColor" stroke-width="58" stroke-linejoin="round" stroke-linecap="round"/>
 </g>
</svg>
