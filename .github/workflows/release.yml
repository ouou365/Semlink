name: Release

# Builds the plugin from the tagged source (committed lockfile) and publishes
# the release with build-provenance attestations, so every asset is
# reproducible and verifiable: `gh attestation verify main.js -R ouou365/Semlink`.
on:
  push:
    tags: ['*']

permissions:
  contents: write      # create the release, upload assets
  id-token: write      # OIDC for artifact attestations
  attestations: write  # store attestations in the registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full fetch so the annotated tag message is readable for the release notes

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" \
            main.js manifest.json styles.css

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
