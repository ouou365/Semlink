name: Release

# Builds the plugin from the tagged source (committed lockfile) and publishes
# the release with build-provenance attestations, so every asset is
# reproducible and verifiable: `gh attestation verify main.js -R ouou365/Semlink`.
#
# Release notes: write them to `.github/releases/<tag>.md` in the release
# commit (English, community style) — the workflow posts that file verbatim.
# (Reading the annotated-tag message on the runner proved unreliable: the tag
# object isn't always fetched, which silently published the wrong notes.)
on:
  push:
    tags: ['*']

permissions:
  contents: write      # create the release, upload assets
  id-token: write      # OIDC for artifact attestations
  attestations: write  # store attestations in the registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE=".github/releases/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::release notes file $NOTES_FILE missing — create it in the release commit"
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" \
            main.js manifest.json styles.css

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
