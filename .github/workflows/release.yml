name: Release

# Builds the plugin from the tagged source (committed lockfile) and publishes
# the release with build-provenance attestations, so every asset is
# reproducible and verifiable: `gh attestation verify main.js -R ouou365/Semlink`.
on:
  push:
    tags: ['*']

permissions:
  contents: write      # create the release, upload assets
  id-token: write      # OIDC for artifact attestations
  attestations: write  # store attestations in the registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history: the annotated tag object must be local
          fetch-tags: true     # checkout doesn't fetch tag objects by default

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Annotated tag: raw object body after the header block. If the tag
          # object isn't local (fetch problem), FAIL loudly — falling back to
          # the commit message silently published Chinese release notes twice.
          NOTES=$(git cat-file tag "$TAG" 2>/dev/null | sed '1,/^$/d' || true)
          if [ -z "$NOTES" ]; then
            echo "::error::annotated tag object for $TAG not available — cannot read English release notes"
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" \
            main.js manifest.json styles.css

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
